root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/main ."
  bin = "/tmp/air/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = false
