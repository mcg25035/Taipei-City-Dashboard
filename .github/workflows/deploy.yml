name: Deploy

on:
  push:
    branches: [develop2026]
  workflow_dispatch:

# 同 ref 串行避免併發 git pull / docker compose 互打
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
      de: ${{ steps.filter.outputs.de }}
      ae: ${{ steps.filter.outputs.ae }}
      qd: ${{ steps.filter.outputs.qd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'Taipei-City-Dashboard-BE/**'
              - 'docker/docker-compose.yaml'
              - 'docker/scripts/restart_be.sh'
            fe:
              - 'Taipei-City-Dashboard-FE/**'
              - 'docker/docker-compose.yaml'
              - 'docker/scripts/restart_fe.sh'
            de:
              - 'Taipei-City-Dashboard-DE/**'
              - 'docker/scripts/restart_de.sh'
            ae:
              - 'Taipei-City-Dashboard-AE/**'
              - 'docker/scripts/restart_ae.sh'
            qd:
              - 'docker/qdrant-upgrade/**'
              - 'docker/scripts/upgrade_qdrant.sh'

  pull:
    needs: changes
    runs-on: self-hosted
    if: |
      needs.changes.outputs.be == 'true' ||
      needs.changes.outputs.fe == 'true' ||
      needs.changes.outputs.de == 'true' ||
      needs.changes.outputs.ae == 'true' ||
      needs.changes.outputs.qd == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Git pull host clone
        run: |
          cd /root/Taipei-City-Dashboard
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull --ff-only origin ${{ github.ref_name }}

  restart-be:
    needs: [changes, pull]
    if: needs.changes.outputs.be == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Run restart_be.sh
        run: bash /root/Taipei-City-Dashboard/docker/scripts/restart_be.sh

  restart-fe:
    needs: [changes, pull]
    if: needs.changes.outputs.fe == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Run restart_fe.sh
        run: bash /root/Taipei-City-Dashboard/docker/scripts/restart_fe.sh

  restart-de:
    needs: [changes, pull]
    if: needs.changes.outputs.de == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Run restart_de.sh
        run: bash /root/Taipei-City-Dashboard/docker/scripts/restart_de.sh

  restart-ae:
    needs: [changes, pull]
    if: needs.changes.outputs.ae == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Run restart_ae.sh
        run: bash /root/Taipei-City-Dashboard/docker/scripts/restart_ae.sh

  upgrade-qdrant:
    needs: [changes, pull]
    if: needs.changes.outputs.qd == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Run upgrade_qdrant.sh
        run: bash /root/Taipei-City-Dashboard/docker/scripts/upgrade_qdrant.sh
